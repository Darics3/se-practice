# week-09/submission.yml — your declaration for this lab.
#
# Facts only. Every explanation goes in lab-report.md; nothing here repeats prose.
# Fill every value. Check it before you push:
#
#     python tests/validate_submission.py
#
# The validator checks shape, never quality. A green run is the floor, not the grade.

schema: 1
week: "09"

student: 
  name: Darkhan Izbassarov
  student_id: 24B031815          # as in KBTU records, e.g. 00X000000
  github: Darics3             # your GitHub username, the one that owns the repo

assistant:
  tool: ChatGPT               # the assistant that wrote the calls in Part 2: ChatGPT, Claude, Gemini, ...
  model:  GPT-5.6 Sol              # the exact model with its version, or: not displayed
  fresh_chats: yes         # yes | no   one fresh chat per request R1, R2, R3

calls:
  r3:  asked                 # asked | called   what the model did with R3 (calls/r3.txt or calls/r3.json)
  first_run_s_fails: 9   # how many of S01-S12 FAILED on your FIRST checker run (lab-report.md section 3)

checker:
  # Numbers from YOUR last run of: python tests/check_tool.py
  # They must add up to the number of checks it runs (30). Report them as they came out.
  # A FAIL you report and explain in lab-report.md costs you nothing. A hidden one costs the criterion.
  pass: 30
  fail: 0
  error: 0
  commit: 4ac6cde             # the commit you ran the checker at: git rev-parse --short HEAD
                       # (normally the commit just before you commit this file — that is fine)
  known_fails: []      # every check ID still FAIL or ERROR, explained in lab-report.md §9, e.g. [F6]

review_findings:
  # Three or more. One line each, and each names what it is about: a case (S01-S12), a request
  # (R1-R3), an action (A1-A8), an AC, or a field (start, end, now, blocked, bookings).
  # Worthless:        "The model was accurate"
  # Worth everything: "R3: the model invented now = 720 and start = 780 instead of asking"
  - "S03: the schema must reject end = \"11:00\" because end must be an integer number of minutes."
  - "R3: the model asked for missing information instead of inventing values, but its clarification did not ask for now."
  - "AC1: the schema can enforce the 0-1440 range, but it cannot compare start and end to enforce start < end."
  - "A8: sending .env to an unknown MCP server must be blocked because it could expose credentials or API keys."

honesty:
  definition_written_by_me: no   #  tool/check_room.json, as AI_USAGE.md says
  calls_unedited: yes         # yes | no   calls/ holds exactly what the model returned
  outputs_unedited: yes       # yes | no   every run in lab-report.md is pasted from a real terminal
  ai_usage_disclosed: yes     # yes | no   AI_USAGE.md is complete
